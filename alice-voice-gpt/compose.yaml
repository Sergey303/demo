name: alice-voice-gpt
services:
  app:
    container_name: alice-voice-gpt
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:18765:8080"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ASPNETCORE_ENVIRONMENT: Production
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-6-luna}"
      MAX_DAILY_REQUESTS: "${MAX_DAILY_REQUESTS:-30}"
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      ALICE_WEBHOOK_TOKEN_FILE: /run/secrets/alice_webhook_token
      # Optional: after registering the skill, set YANDEX_SKILL_ID in .env.
      YANDEX_SKILL_ID: "${YANDEX_SKILL_ID:-}"
    secrets:
      - openai_api_key
      - alice_webhook_token
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
secrets:
  openai_api_key:
    file: ./secrets/openai_api_key
  alice_webhook_token:
    file: ./secrets/alice_webhook_token
