name: Hiring demo checks

on:
  push:
    paths:
      - 'bootstrap5/**'
      - 'hiring-demo/**'
      - 'enterprise-demo/**'
      - 'architecture/**'
      - 'dotnet-outbox/**'
      - '.github/workflows/hiring-demo.yml'
  pull_request:
    paths:
      - 'bootstrap5/**'
      - 'hiring-demo/**'
      - 'enterprise-demo/**'
      - 'architecture/**'
      - 'dotnet-outbox/**'
      - '.github/workflows/hiring-demo.yml'

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline launcher tests
        run: python -m unittest discover -s hiring-demo/tests -v
      - name: Compile launcher
        run: python -m py_compile hiring-demo/run.py
      - name: Enterprise launcher and signed-token tests
        run: python -m unittest discover -s enterprise-demo/tests -v
      - name: Compile enterprise launcher
        run: python -m py_compile enterprise-demo/run.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bootstrap5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bootstrap5/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify trusted proxy signer
        run: node --test tests/enterprise-auth.test.mjs
      - name: Browser contract tests (mocked HTTP)
        run: npx playwright test tests/hiring-demo.spec.ts tests/enterprise-ai.spec.ts tests/enterprise-documents.spec.ts tests/enterprise-search.spec.ts tests/enterprise-answer.spec.ts tests/enterprise-generated.spec.ts tests/mcp-agent.spec.ts

  live-screencast:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: reliable_jobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo -d reliable_jobs"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      ConnectionStrings__Jobs: Host=127.0.0.1;Port=5432;Database=reliable_jobs;Username=demo;Password=demo
      LIVE_HIRING_DEMO: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bootstrap5/package-lock.json
      - name: Initialize and migrate disposable PostgreSQL schema
        env:
          PGPASSWORD: demo
        run: |
          for migration in \
            dotnet-outbox/sql/001_init.sql \
            dotnet-outbox/sql/002_audio_jobs.sql \
            dotnet-outbox/sql/003_audio_leases.sql \
            dotnet-outbox/sql/004_audio_acl.sql \
            dotnet-outbox/sql/005_document_jobs.sql \
            dotnet-outbox/sql/006_agent_notes.sql; do
            psql -h 127.0.0.1 -p 5432 -U demo -d reliable_jobs -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h 127.0.0.1 -p 5432 -U demo -d reliable_jobs -v ON_ERROR_STOP=1 -c "SELECT kind, tenant_id, document_name FROM jobs LIMIT 0"
          psql -h 127.0.0.1 -p 5432 -U demo -d reliable_jobs -v ON_ERROR_STOP=1 -c "SELECT job_id FROM audio_read_grants LIMIT 0"
      - name: Build real .NET worker API
        run: dotnet build -c Release dotnet-outbox/src/ReliableJobs.csproj
      - name: Unit and real PostgreSQL transaction tests (.NET 10)
        env:
          JOBS_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=reliable_jobs;Username=demo;Password=demo
        run: dotnet test -c Release dotnet-outbox/tests/ReliableJobs.Tests.csproj --logger "console;verbosity=minimal"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight Python PostgreSQL test dependencies (no ML model downloads)
        run: python -m pip install "psycopg[binary]>=3.2,<4" "pytest>=8,<10" "fastapi>=0.115,<1" "httpx>=0.27,<1" "mcp>=2.3,<2.4"
      - name: Real PostgreSQL Qwen-generation grants, exact quotes, search and outbox
        env:
          JOBS_TEST_CONNECTION: host=127.0.0.1 port=5432 dbname=reliable_jobs user=demo password=demo
          DEMO_AUTH_SECRET: ci-ep03-only-not-a-real-credential-1234567890
        run: python -m pytest -q architecture/tests/test_mcp_agent_postgres.py architecture/tests/test_guarded_generation.py architecture/tests/test_generation_postgres.py architecture/tests/test_evidence_answer.py architecture/tests/test_answer_postgres.py architecture/tests/test_unified_search.py architecture/tests/test_search_postgres.py architecture/tests/test_documents_postgres.py architecture/tests/test_audio_postgres.py architecture/tests/test_audio_access.py architecture/tests/test_document_pipeline.py
      - name: Install React dependencies
        working-directory: bootstrap5
        run: npm ci
      - name: Install Chromium
        working-directory: bootstrap5
        run: npx playwright install --with-deps chromium
      - name: Record real end-to-end browser session
        working-directory: bootstrap5
        run: npx playwright test tests/hiring-demo-live.spec.ts --workers=1
      - name: Preserve actual screencast, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hiring-demo-real-postgresql-screencast
          path: |
            bootstrap5/test-results/
            bootstrap5/playwright-report/
          retention-days: 14
          if-no-files-found: warn
