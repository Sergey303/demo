name: Edge baseline offline tests

on:
  push:
    paths:
      - 'EdgeNetworkSecurity/**'
      - 'EdgeAI/**'
      - 'EdgeIntegratedScenarios/**'
      - '.github/workflows/edge-baselines.yml'
  pull_request:
    paths:
      - 'EdgeNetworkSecurity/**'
      - 'EdgeAI/**'
      - 'EdgeIntegratedScenarios/**'
      - '.github/workflows/edge-baselines.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Offline BGP, Anycast, anomaly and integration tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m unittest discover -s EdgeNetworkSecurity/simulator/bgp/tests -v
          python -B -m unittest discover -s EdgeNetworkSecurity/simulator/anycast/tests -v
          python -B -m unittest discover -s EdgeAI/scenarios/traffic-anomaly-detection/tests -v
          python -B -m unittest discover -s EdgeIntegratedScenarios/ai-assisted-ddos-defense/tests -v
          python -B -m unittest discover -s EdgeIntegratedScenarios/tests -v
          python -B -m unittest discover -s EdgeAI/tests -v
          python -B EdgeIntegratedScenarios/run.py
          python -B EdgeIntegratedScenarios/task_inventory.py --check
          python -B EdgeAI/benchmarks/compare.py
      - name: Prepare disposable Redis 7 test image
        run: docker pull redis:7-alpine
      - name: Loopback HTTP, safe probe and real disposable Redis 7 tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          RUN_REDIS_TESTS: '1'
        run: |
          docker version
          python -B -m unittest discover -s EdgeNetworkSecurity/shared/traffic-generator/tests -v
          python -B -m unittest discover -s EdgeNetworkSecurity/implementations/local/tests -v
          RUN_EDGE_HTTP_TESTS=1 python -B -m unittest discover -s EdgeIntegratedScenarios/tests -v

  provider-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloudflare Worker contract unit tests (no provider API calls)
        run: |
          node --check EdgeNetworkSecurity/implementations/cloudflare/workers/request-guard/worker.mjs
          node --test EdgeNetworkSecurity/implementations/cloudflare/workers/request-guard/worker.test.mjs
      - name: Offline EdgeCenter and Yandex staging intent validation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install -r EdgeNetworkSecurity/implementations/edgecenter-ru/contract/requirements.txt
          python -B -m unittest discover -s EdgeNetworkSecurity/implementations/edgecenter-ru/contract -p test_contract.py -v
          python -B -m unittest discover -s EdgeNetworkSecurity/implementations/yandex-cloud/contract -p test_contract.py -v
          python -B EdgeNetworkSecurity/implementations/edgecenter-ru/contract/validate.py EdgeNetworkSecurity/implementations/edgecenter-ru/contract/fixtures/enforce.json
          python -B EdgeNetworkSecurity/implementations/yandex-cloud/contract/validate.py EdgeNetworkSecurity/implementations/yandex-cloud/contract/fixtures/enforce.json

  evidence-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EdgeIntegratedScenarios/dashboard/package-lock.json
      - name: Validate checked-in evidence and React dashboard contracts
        working-directory: EdgeIntegratedScenarios/dashboard
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

  onnx-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: EdgeAI/implementations/onnx-local/requirements.txt
      - name: Install pinned CPU ONNX packages
        run: python -m pip install -r EdgeAI/implementations/onnx-local/requirements.txt
      - name: Generate model and execute native ONNX CPU runtime
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -B EdgeAI/implementations/onnx-local/build_model.py
          python -B -m unittest discover -s EdgeAI/implementations/onnx-local/tests -v
          python -B -m unittest discover -s EdgeIntegratedScenarios/onnx-tests -v
          python -B EdgeAI/implementations/onnx-local/runtime.py --window-json '{"requests":250,"seconds":10,"errors":45,"baseline_rps":3}'
          python -B EdgeAI/implementations/onnx-local/benchmark.py --iterations 20
          python -B EdgeIntegratedScenarios/ai-assisted-ddos-defense/onnx_replay.py
